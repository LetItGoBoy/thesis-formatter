<svg viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="手动编辑论文示意图">
  <defs>
    <linearGradient id="desk-bg" x1="0" y1="0" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F4F8"/><stop offset="1" stop-color="#E8EDF3"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="80" y1="30" x2="400" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="pencil-body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E53E3E"/><stop offset="1" stop-color="#C53030"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDDCB5"/><stop offset="1" stop-color="#F6C28B"/>
    </linearGradient>
    <filter id="paper-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#94A3B8" flood-opacity="0.25"/>
    </filter>
    <filter id="pencil-shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000040"/>
    </filter>
    <filter id="hand-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#00000030"/>
    </filter>
    <clipPath id="paper-clip">
      <rect x="80" y="28" width="340" height="370" rx="6"/>
    </clipPath>
  </defs>

  <!-- Desk surface -->
  <rect width="560" height="420" rx="0" fill="url(#desk-bg)"/>
  <!-- Subtle wood grain lines -->
  <line x1="0" y1="85" x2="560" y2="85" stroke="#DDE3EB" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="200" x2="560" y2="200" stroke="#DDE3EB" stroke-width="0.7" opacity="0.4"/>
  <line x1="0" y1="330" x2="560" y2="330" stroke="#DDE3EB" stroke-width="0.7" opacity="0.4"/>

  <!-- Keyboard hint bottom-right -->
  <rect x="390" y="310" width="140" height="80" rx="10" fill="#CBD5E1" opacity="0.55"/>
  <rect x="400" y="320" width="30" height="16" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="436" y="320" width="30" height="16" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="472" y="320" width="50" height="16" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="400" y="342" width="22" height="14" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="428" y="342" width="22" height="14" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="456" y="342" width="22" height="14" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="484" y="342" width="38" height="14" rx="3" fill="#94A3B8" opacity="0.7"/>
  <rect x="400" y="362" width="122" height="20" rx="3" fill="#94A3B8" opacity="0.7"/>

  <!-- Paper document -->
  <g filter="url(#paper-shadow)">
    <rect x="80" y="28" width="340" height="370" rx="6" fill="url(#paper-grad)" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Paper content clipped -->
  <g clip-path="url(#paper-clip)">
    <!-- Header line (title) -->
    <rect x="140" y="58" width="220" height="13" rx="3" fill="#334155"/>
    <!-- Subtitle -->
    <rect x="175" y="80" width="150" height="9" rx="2" fill="#64748B"/>

    <!-- Section line -->
    <line x1="105" y1="104" x2="395" y2="104" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Body text lines -->
    <rect x="105" y="116" width="290" height="8" rx="2" fill="#94A3B8"/>
    <rect x="105" y="132" width="280" height="8" rx="2" fill="#94A3B8"/>
    <rect x="105" y="148" width="275" height="8" rx="2" fill="#94A3B8"/>
    <rect x="105" y="164" width="290" height="8" rx="2" fill="#94A3B8"/>
    <rect x="105" y="180" width="240" height="8" rx="2" fill="#94A3B8"/>

    <!-- Red annotation marks on a line -->
    <rect x="105" y="200" width="170" height="9" rx="2" fill="#94A3B8"/>
    <!-- Red underline / correction mark -->
    <path d="M106 212 Q140 208 175 213 Q210 218 245 212 Q270 208 275 212" stroke="#E53E3E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Red strikethrough on a word -->
    <rect x="180" y="200" width="60" height="9" rx="2" fill="#FCA5A5" opacity="0.5"/>
    <line x1="180" y1="204" x2="240" y2="205" stroke="#E53E3E" stroke-width="1.5"/>
    <!-- Correction written above -->
    <path d="M185 193 Q200 188 220 193" stroke="#C53030" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <rect x="188" y="185" width="32" height="7" rx="1.5" fill="#FCA5A5" opacity="0.7"/>

    <rect x="105" y="222" width="290" height="8" rx="2" fill="#94A3B8"/>
    <rect x="105" y="238" width="265" height="8" rx="2" fill="#94A3B8"/>

    <!-- Margin note -->
    <path d="M396 148 L420 152 L420 185 L396 180" stroke="#E53E3E" stroke-width="1.2" fill="#FFF5F5" fill-opacity="0.8"/>
    <rect x="400" y="156" width="16" height="5" rx="1" fill="#E53E3E" opacity="0.6"/>
    <rect x="400" y="165" width="16" height="5" rx="1" fill="#E53E3E" opacity="0.6"/>
    <rect x="400" y="174" width="10" height="5" rx="1" fill="#E53E3E" opacity="0.6"/>

    <!-- More body lines below -->
    <rect x="105" y="260" width="290" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="105" y="276" width="270" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="105" y="292" width="290" height="8" rx="2" fill="#CBD5E1"/>
    <rect x="105" y="308" width="200" height="8" rx="2" fill="#CBD5E1"/>

    <!-- Section divider -->
    <line x1="105" y1="330" x2="395" y2="330" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="105" y="344" width="290" height="8" rx="2" fill="#E2E8F0"/>
    <rect x="105" y="360" width="260" height="8" rx="2" fill="#E2E8F0"/>

    <!-- Page number -->
    <rect x="235" y="384" width="30" height="7" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- HAND holding pencil -->
  <g filter="url(#hand-shadow)">
    <!-- Palm / hand base -->
    <ellipse cx="370" cy="355" rx="72" ry="42" fill="url(#skin-grad)" transform="rotate(-38 370 355)"/>

    <!-- Thumb -->
    <path d="M305 320 Q295 305 298 290 Q302 276 316 278 Q328 280 328 295 Q328 310 318 320 Z" fill="url(#skin-grad)"/>
    <!-- Thumb knuckle crease -->
    <path d="M306 318 Q302 305 305 294" stroke="#E8A96B" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Index finger (holding pencil) -->
    <path d="M330 285 Q328 262 332 245 Q336 232 345 230 Q355 229 357 240 Q360 255 355 272 Q350 288 342 295 Z" fill="url(#skin-grad)"/>
    <!-- Index finger crease -->
    <path d="M332 283 Q336 268 340 255" stroke="#E8A96B" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M334 268 Q338 258 342 250" stroke="#E8A96B" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Middle finger -->
    <path d="M348 290 Q348 265 352 248 Q356 234 366 232 Q376 232 376 246 Q377 262 373 278 Q368 293 360 298 Z" fill="url(#skin-grad)"/>
    <path d="M350 288 Q354 270 358 255" stroke="#E8A96B" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Ring finger (slightly back) -->
    <path d="M365 298 Q367 278 370 264 Q374 252 382 252 Q391 253 390 267 Q390 282 385 295 Q379 306 372 310 Z" fill="url(#skin-grad)" opacity="0.9"/>

    <!-- Knuckle highlights -->
    <ellipse cx="337" cy="286" rx="5" ry="4" fill="#FDDCB5" opacity="0.6" transform="rotate(-10 337 286)"/>
    <ellipse cx="356" cy="290" rx="5" ry="4" fill="#FDDCB5" opacity="0.6" transform="rotate(-8 356 290)"/>

    <!-- Wrist -->
    <path d="M298 330 Q310 345 340 355 Q365 360 400 350 Q420 345 430 335 Q420 360 395 372 Q360 382 325 370 Q295 358 290 342 Z" fill="url(#skin-grad)"/>
    <!-- Wrist crease -->
    <path d="M306 348 Q335 358 368 352 Q395 347 415 338" stroke="#E8A96B" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- RED PENCIL -->
  <g filter="url(#pencil-shadow)" transform="rotate(-42 340 260)">
    <!-- Eraser ferrule (silver) -->
    <rect x="320" y="150" width="16" height="10" rx="1" fill="#A0AEC0"/>
    <line x1="320" y1="153" x2="336" y2="153" stroke="#718096" stroke-width="0.8"/>
    <line x1="320" y1="157" x2="336" y2="157" stroke="#718096" stroke-width="0.8"/>
    <!-- Eraser (pink) -->
    <rect x="320" y="140" width="16" height="12" rx="3" fill="#F9A8D4"/>
    <!-- Pencil body (red) -->
    <rect x="320" y="160" width="16" height="130" fill="url(#pencil-body)"/>
    <!-- Pencil side sheen -->
    <rect x="322" y="160" width="3" height="130" fill="#FC8181" opacity="0.5"/>
    <!-- Pencil hex facet lines -->
    <line x1="320" y1="160" x2="320" y2="290" stroke="#C53030" stroke-width="0.6" opacity="0.5"/>
    <line x1="336" y1="160" x2="336" y2="290" stroke="#C53030" stroke-width="0.6" opacity="0.5"/>
    <!-- Wood taper -->
    <path d="M320 290 L328 310 L336 290 Z" fill="#DEB887"/>
    <!-- Graphite tip -->
    <path d="M324 310 L328 322 L332 310 Z" fill="#4A5568"/>
  </g>

  <!-- Glare / ambient on paper -->
  <ellipse cx="200" cy="120" rx="60" ry="30" fill="#FFFFFF" opacity="0.18" transform="rotate(-10 200 120)"/>
</svg>
