  </g>
  <rect x="120" y="86" width="118" height="14" rx="7" fill="url(#ck-acc)"/>
  <rect x="120" y="120" width="172" height="9" rx="4.5" fill="#E2E8F0"/>
  <rect x="120" y="140" width="150" height="9" rx="4.5" fill="#E2E8F0"/>
