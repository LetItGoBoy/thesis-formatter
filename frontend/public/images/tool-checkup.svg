  <circle cx="128" cy="178" r="9" fill="#FEF3C7"/><path d="M124 178l3 3 5-6" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="146" y="173" width="120" height="9" rx="4.5" fill="#E2E8F0"/>
  <circle cx="128" cy="204" r="9" fill="#FEF3C7"/><path d="M124 204l3 3 5-6" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="146" y="199" width="104" height="9" rx="4.5" fill="#E2E8F0"/>
